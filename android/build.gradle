plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

group = 'algorithmx.engage.flutter'
version = '1.0.3'

android {
    // Vendored Kotlin sources import algorithmx.engage.R for layouts/styles.
    namespace 'algorithmx.engage'
    compileSdk 34

    defaultConfig {
        // The bundled AlgorithmX Android SDK requires API 24 or later.
        minSdk 24
        targetSdk 34
        consumerProguardFiles 'consumer-rules.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

dependencies {
    // Flutter adds its Android embedding to a plugin's compile classpath.
    // The SDK itself has no Firebase dependency; the host owns FCM delivery.
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'androidx.sqlite:sqlite-ktx:2.4.0'
}
